name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start test broker
        working-directory: testbroker
        run: |
          ./create-passwd.sh
          docker compose up -d
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Test
        env:
          MQTT_TEST_BROKER: 127.0.0.1:1883
        run: pytest -v
      - name: Broker log
        if: always()
        working-directory: testbroker
        run: docker compose logs mosquitto | tail -n 100
