name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start test broker
        working-directory: testbroker
        run: ./setup.sh
      - name: Start DynSec test broker
        working-directory: testbroker-dynsec
        run: ./setup.sh
      - name: Manage DynSec with the certificate admin (no password)
        working-directory: testbroker-dynsec
        run: |
          docker compose exec -T mosquitto mosquitto_ctrl -h localhost -p 8885 \
            --cafile /mosquitto/certs/ca.crt \
            --cert /mosquitto/certs/dynsec-admin-cert.crt --key /mosquitto/certs/dynsec-admin-cert.key \
            dynsec getDefaultACLAccess
      - name: PMSS design v0.7 - control API on listener 8886 (admin CA)
        working-directory: testbroker-dynsec
        run: |
          # mosquitto_ctrl exits with 0 even on "Not authorized": check the output.
          # Access means the client list (which contains pmss-admin) is returned.
          ctrl() {
            docker compose exec -T mosquitto mosquitto_ctrl -h localhost -p 8886 \
              --cafile /mosquitto/certs/ca.crt \
              --cert "/mosquitto/certs/$1.crt" --key "/mosquitto/certs/$1.key" \
              dynsec listClients 2>&1 | grep -qx pmss-admin
          }
          # role_security_manager may manage DynSec
          ctrl pmss-admin
          ctrl pmss-breakglass-admin
          # deleteClient locks an admin certificate
          if ctrl pmss-admin-deleted; then echo "deleted admin still has access"; exit 1; fi
          # known weakness: disableClient does not lock a certificate login
          if ! ctrl pmss-admin-disabled; then echo "disableClient now locks certificate logins"; exit 1; fi
      - name: PMSS design v0.8 - mis-issued admin CN on the app listener 8887
        working-directory: testbroker-dynsec
        run: |
          # An app certificate with CN=pmss-admin (from the app CA or the intermediate CA)
          # logs in as "CN=pmss-admin,O=mqtt-apps" and must not reach the control API.
          ctrl() {
            docker compose exec -T mosquitto mosquitto_ctrl -h localhost -p 8887 \
              --cafile /mosquitto/certs/ca.crt \
              --cert "/mosquitto/certs/$1" --key "/mosquitto/certs/$2" \
              dynsec listClients 2>&1 | grep -qx pmss-admin
          }
          if ctrl app-pmss-admin.crt app-pmss-admin.key; then echo "app CA certificate got admin rights"; exit 1; fi
          if ctrl int-pmss-admin-chain.crt int-pmss-admin.key; then echo "intermediate CA certificate got admin rights"; exit 1; fi
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Test
        env:
          MQTT_TEST_BROKER: 127.0.0.1:1883
          MQTT_TEST_BROKER_DYNSEC: 127.0.0.1:1884
        run: pytest -v
      - name: Broker log
        if: always()
        working-directory: testbroker
        run: docker compose logs mosquitto | tail -n 100
      - name: DynSec broker log
        if: always()
        working-directory: testbroker-dynsec
        run: docker compose logs mosquitto | tail -n 100
