# Config for the Dynamic Security test broker (testbroker-dynsec/). Password for all users: "test".
#   export MQTT_OBSERVER_PASSWORD=test MQTT_DYNSEC_ADMIN_PASSWORD=test \
#          MQTT_PW_KITCHEN=test MQTT_PW_LIVINGROOM=test MQTT_PW_TASMOFLEET=test \
#          MQTT_PW_HOMEASSISTANT=test MQTT_PW_VIEWER=test MQTT_PW_UNKNOWN=wrong

endpoints:
  plain:
    host: 127.0.0.1
    port: 1884
  # Variant A: mTLS plus password
  mtls-pw:
    host: 127.0.0.1
    port: 8884
    tls: true
    ca_file: certs/ca.crt
  # Variant B: mTLS, username = certificate CN
  mtls-id:
    host: 127.0.0.1
    port: 8885
    tls: true
    ca_file: certs/ca.crt
  # PMSS design v0.7: like mtls-id, but only the admin CA is accepted
  mtls-admin:
    host: 127.0.0.1
    port: 8886
    tls: true
    ca_file: certs/ca.crt
  # PMSS design v0.8 (production 8883): TLS with password
  tls-pw:
    host: 127.0.0.1
    port: 8883
    tls: true
    ca_file: certs/ca.crt
  # PMSS design v0.8 (production 8885): app CA, username = full subject
  mtls-app:
    host: 127.0.0.1
    port: 8887
    tls: true
    ca_file: certs/ca.crt
  # Revocation (cases-revocation.yaml): like mtls-app, with CRL / expired CRL / two roots
  mtls-crl:
    host: 127.0.0.1
    port: 8888
    tls: true
    ca_file: certs/ca.crt
  mtls-crl-expired:
    host: 127.0.0.1
    port: 8889
    tls: true
    ca_file: certs/ca.crt
  mtls-two-roots:
    host: 127.0.0.1
    port: 8890
    tls: true
    ca_file: certs/ca.crt

# The DynSec admin only manages DynSec and has no access to normal topics.
# A separate client with full rights observes the tests.
observer: observer
timeout: 1.0

identities:
  observer:      {username: observer,      password_env: MQTT_OBSERVER_PASSWORD}
  dynsec-admin:  {username: dynsec-admin,  password_env: MQTT_DYNSEC_ADMIN_PASSWORD}

  # --- Admin login variants (cases-mtls.yaml); paths relative to this file ---
  admin-pw-cert:
    username: dynsec-admin
    password_env: MQTT_DYNSEC_ADMIN_PASSWORD
    cert_file: certs/dynsec-admin.crt
    key_file: certs/dynsec-admin.key
  admin-pw-wrong:
    username: dynsec-admin
    password_env: MQTT_PW_UNKNOWN
    cert_file: certs/dynsec-admin.crt
    key_file: certs/dynsec-admin.key
  admin-pw-stranger-cert:      # admin password, but someone else's certificate
    username: dynsec-admin
    password_env: MQTT_DYNSEC_ADMIN_PASSWORD
    cert_file: certs/stranger.crt
    key_file: certs/stranger.key
  admin-cert:                  # no username, no password: the CN is the username
    username: null
    cert_file: certs/dynsec-admin-cert.crt
    key_file: certs/dynsec-admin-cert.key
  admin-cert-claims-pw-admin:  # certificate of dynsec-admin-cert, claims to be dynsec-admin
    username: dynsec-admin
    password_env: MQTT_PW_UNKNOWN
    cert_file: certs/dynsec-admin-cert.crt
    key_file: certs/dynsec-admin-cert.key
  admin-cert-name-only:        # username of the cert admin, without certificate
    username: dynsec-admin-cert
  admin-cert-name-guess:
    username: dynsec-admin-cert
    password_env: MQTT_PW_UNKNOWN
  stranger-cert:               # valid certificate, CN not known to DynSec
    username: null
    cert_file: certs/stranger.crt
    key_file: certs/stranger.key

  # --- PMSS design v0.7 (cases-mtls.yaml, listener 8886, admin CA) ---
  pmss-admin:
    username: null
    cert_file: certs/pmss-admin.crt
    key_file: certs/pmss-admin.key
  pmss-breakglass-admin:
    username: null
    cert_file: certs/pmss-breakglass-admin.crt
    key_file: certs/pmss-breakglass-admin.key
  pmss-admin-disabled:         # exists in DynSec, disabled
    username: null
    cert_file: certs/pmss-admin-disabled.crt
    key_file: certs/pmss-admin-disabled.key
  pmss-admin-deleted:          # was an admin, deleted in DynSec
    username: null
    cert_file: certs/pmss-admin-deleted.crt
    key_file: certs/pmss-admin-deleted.key
  admin-ca-unknown:            # certificate of the admin CA, CN not known to DynSec
    username: null
    cert_file: certs/admin-ca-unknown.crt
    key_file: certs/admin-ca-unknown.key
  pmss-admin-name-only:        # username of pmss-admin, without certificate
    username: pmss-admin
  pmss-admin-name-guess:
    username: pmss-admin
    password_env: MQTT_PW_UNKNOWN
  dynsec-bootstrap:            # bootstrap admin, deleted after the setup
    username: dynsec-bootstrap
    password_env: MQTT_DYNSEC_ADMIN_PASSWORD

  # --- PMSS design v0.8 (cases-apps.yaml, listener 8887, app CA) ---
  app-homeassistant:           # app CA, DynSec client CN=homeassistant,O=mqtt-apps
    username: null
    cert_file: certs/app-homeassistant.crt
    key_file: certs/app-homeassistant.key
  app-pmss-admin:              # app CA, mis-issued with CN=pmss-admin
    username: null
    cert_file: certs/app-pmss-admin.crt
    key_file: certs/app-pmss-admin.key
  int-viewer-chain:            # intermediate CA, file contains certificate + intermediate CA
    username: null
    cert_file: certs/int-viewer-chain.crt
    key_file: certs/int-viewer.key
  int-viewer-leaf-only:        # intermediate CA, certificate only
    username: null
    cert_file: certs/int-viewer.crt
    key_file: certs/int-viewer.key
  int-pmss-admin-chain:        # intermediate CA, mis-issued with CN=pmss-admin
    username: null
    cert_file: certs/int-pmss-admin-chain.crt
    key_file: certs/int-pmss-admin.key
  app-reused-old:              # compromised, client deleted and created again (same subject)
    username: null
    cert_file: certs/app-reused-old.crt
    key_file: certs/app-reused-old.key
  app-reused-new:
    username: null
    cert_file: certs/app-reused-new.crt
    key_file: certs/app-reused-new.key
  app-renamed-old:             # compromised, client deleted; new certificate has a new subject
    username: null
    cert_file: certs/app-renamed-old.crt
    key_file: certs/app-renamed-old.key
  app-renamed-new:
    username: null
    cert_file: certs/app-renamed-new.crt
    key_file: certs/app-renamed-new.key
  # --- Revocation (cases-revocation.yaml) ---
  app-revoked:                 # app CA, revoked in the CRL of the app CA
    username: null
    cert_file: certs/app-revoked.crt
    key_file: certs/app-revoked.key
  int-revokedca-chain:         # from an intermediate CA that is revoked in the CRL of the app CA
    username: null
    cert_file: certs/int-revokedca-chain.crt
    key_file: certs/int-revokedca.key
  int-nocrl-chain:             # from a valid intermediate CA without a CRL of its own
    username: null
    cert_file: certs/int-nocrl-chain.crt
    key_file: certs/int-nocrl.key
  tf-app:                      # from the separate TasmoFleet root CA
    username: null
    cert_file: certs/tf-app.crt
    key_file: certs/tf-app.key
  app-name-only:               # subject username of the app client, without certificate
    username: "CN=homeassistant,O=mqtt-apps"
  app-name-guess:
    username: "CN=homeassistant,O=mqtt-apps"
    password_env: MQTT_PW_UNKNOWN

  kitchen:       {username: kitchen,       password_env: MQTT_PW_KITCHEN}
  livingroom:    {username: livingroom,    password_env: MQTT_PW_LIVINGROOM}
  tasmofleet:    {username: tasmofleet,    password_env: MQTT_PW_TASMOFLEET}
  homeassistant: {username: homeassistant, password_env: MQTT_PW_HOMEASSISTANT}
  viewer:        {username: viewer,        password_env: MQTT_PW_VIEWER}
  unknown:       {username: nobody,        password_env: MQTT_PW_UNKNOWN}
