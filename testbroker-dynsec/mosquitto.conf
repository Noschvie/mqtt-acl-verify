# Local Mosquitto with Dynamic Security for mqtt-acl-verify. Not for production.
# Equivalent to testbroker/ (Classic ACL), see dynsec-setup.txt.

per_listener_settings false
allow_anonymous false

# Plain listener for devices and applications (host port 1884)
listener 1883

# Variant A (PMSS design): mTLS plus DynSec password (host port 8884)
listener 8884
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true

# Variant B (overview): mTLS, username taken from the certificate CN, no password (host port 8885)
listener 8885
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

# PMSS design v0.7: like variant B, but only certificates of the dedicated
# admin CA are accepted; the server certificate comes from the server CA (host port 8886)
listener 8886
cafile /mosquitto/certs/admin-ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

# PMSS design v0.8 (production port 8883): TLS with password, same rights as 1883
listener 8883
certfile /mosquitto/certs/server-ext.crt
keyfile /mosquitto/certs/server-ext.key
tls_version tlsv1.2

# PMSS design v0.8 (production port 8885): applications only with a certificate of
# the app CA, username = full subject, e.g. "CN=homeassistant,O=mqtt-apps" (host port 8887)
listener 8887
cafile /mosquitto/certs/app-ca.crt
certfile /mosquitto/certs/server-ext.crt
keyfile /mosquitto/certs/server-ext.key
require_certificate true
use_subject_as_username true
tls_version tlsv1.2

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

log_dest stdout
log_type all
log_timestamp true
