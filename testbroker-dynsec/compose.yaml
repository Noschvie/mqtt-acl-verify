# Start:   ./setup.sh            (initialises DynSec on first run)
# Logs:    docker compose logs mosquitto > broker.log
# Host ports 1884 (plain), 8883 (TLS), 8884-8892 (mTLS); runs next to testbroker/ (1883).

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine   # same version as production
    ports:
      - "127.0.0.1:1884:1883"
      - "127.0.0.1:8884:8884"
      - "127.0.0.1:8885:8885"
      - "127.0.0.1:8886:8886"
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:8887:8887"
      - "127.0.0.1:8888-8892:8888-8892"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data:/mosquitto/data
      - ./certs:/mosquitto/certs:ro
