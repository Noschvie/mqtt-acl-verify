# Start:   ./setup.sh            (initialises DynSec on first run)
# Logs:    docker compose logs mosquitto > broker.log
# Host port 1884, so it can run next to testbroker/ (1883).

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine   # same version as production
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data:/mosquitto/data
