# Start:   ./create-passwd.sh && docker compose up
# Logs:    docker compose logs -f mosquitto > broker.log

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine   # same version as production
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./passwd:/mosquitto/config/passwd:ro
